name: Week in Review (long YouTube video)
# Runs in this PUBLIC repo, so it uses no GitHub Actions minutes. It reads this repo's
# daily news files and borrows the backgrounds, music and scripts from the private
# world-news-reels repo (with GH_PAT), then uploads one long video per language to YouTube.
# Only scheduled and manual runs — never add pull_request triggers to this file.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * 0"   # Sun 20:30 UTC = Mon 07:30 Sydney
permissions:
  contents: read
jobs:
  week-review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        lang: [en, es]
    steps:
      - name: Check out the news files (this repo)
        uses: actions/checkout@v4
        with:
          path: news
      - name: Check out the videos, music and scripts (private repo)
        uses: actions/checkout@v4
        with:
          repository: fervaldies/world-news-reels
          token: ${{ secrets.GH_PAT }}
          path: reels
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        timeout-minutes: 5
        run: |
          CURL="curl -fsSL --connect-timeout 20 --max-time 180 --retry 3 --retry-delay 5 --retry-all-errors"
          if $CURL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -o ffmpeg.tar.xz \
             && tar -xf ffmpeg.tar.xz; then
            sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          elif $CURL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o ffmpeg2.tar.xz \
             && tar -xf ffmpeg2.tar.xz; then
            sudo mv ffmpeg-*-amd64-static/ffmpeg ffmpeg-*-amd64-static/ffprobe /usr/local/bin/
          else
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          rm -rf ffmpeg*.tar.xz ffmpeg-master-latest-linux64-gpl ffmpeg-*-amd64-static
          ffmpeg -version | head -1
      - name: Install dependencies
        working-directory: reels
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyyaml edge-tts
      - name: Make and upload the week in review
        working-directory: reels
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ matrix.lang == 'en' && secrets.YOUTUBE_EN_REFRESH_TOKEN || secrets.YOUTUBE_ES_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python build_week_review.py --lang ${{ matrix.lang }} \
            --news-dir "$GITHUB_WORKSPACE/news" \
            --channel-en "World News" --channel-es "Noticias del Mundo" --name "World" --flag "🌍" \
            --video-prefix worldvideo --video-count 32 \
            --music-prefix worldmusic --music-count 32 \
            --out week_review_${{ matrix.lang }}
