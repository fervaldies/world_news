name: Breaking news alerts (Telegram)

# Runs entirely in this PUBLIC repo (no Actions minutes). Uses its own Telegram bot
# (TELEGRAM_ALERTS_BOT_TOKEN) — Newsdesk never reads it. Only Fer's chat is answered.
#   job "bot":  every 10 min reads Fer's taps; at ALERT_HOURS (Sydney) runs the breaking check;
#               after an alert or a draft it keeps listening live for ALERT_LISTEN_MIN minutes.
#   job "post": only after Publish — checks out the chosen private reels repo (GH_PAT), renders,
#               sends the videos to approve, posts, writes news-metrics records (upload scripts).
# Bot state lives in the private news-metrics repo (branch alerts-state, [skip ci] commits).
# Public log shows status lines only; full logs of failures go to Telegram.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      check_now:
        description: "Run the breaking check now"
        type: boolean
        default: false

concurrency:
  group: alerts-bot           # only ONE job may read the bot at a time
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      post: ${{ steps.bot.outputs.post }}
      draft: ${{ steps.bot.outputs.draft }}
      repo: ${{ steps.bot.outputs.repo }}
      chk: ${{ steps.bot.outputs.chk }}
      yt_en: ${{ steps.bot.outputs.yt_en }}
      yt_es: ${{ steps.bot.outputs.yt_es }}
      yt_pt: ${{ steps.bot.outputs.yt_pt }}
      yt_id: ${{ steps.bot.outputs.yt_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: alerts
      - name: Read taps, check for breaking news, draft
        id: bot
        env:
          TELEGRAM_ALERTS_BOT_TOKEN: ${{ secrets.TELEGRAM_ALERTS_BOT_TOKEN }}
          TELEGRAM_ALERTS_CHAT_ID: ${{ secrets.TELEGRAM_ALERTS_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALERT_HOURS: ${{ vars.ALERT_HOURS }}
          ALERT_LISTEN_MIN: ${{ vars.ALERT_LISTEN_MIN }}
          ALERT_APPROVE_VIDEO: ${{ vars.ALERT_APPROVE_VIDEO }}
          CHECK_NOW: ${{ inputs.check_now }}
        run: |
          pip install -q pyyaml
          python3 alerts/alerts.py bot

  post:
    needs: bot
    if: needs.bot.outputs.post == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: alerts
      - name: Check out the videos, music and scripts (private repo)
        uses: actions/checkout@v4
        with:
          repository: fervaldies/${{ needs.bot.outputs.repo }}
          token: ${{ secrets.GH_PAT }}
          path: reels
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        timeout-minutes: 5
        run: |
          CURL="curl -fsSL --connect-timeout 20 --max-time 180 --retry 3 --retry-delay 5 --retry-all-errors"
          if $CURL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -o ffmpeg.tar.xz && tar -xf ffmpeg.tar.xz; then
            sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          elif $CURL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o ffmpeg2.tar.xz && tar -xf ffmpeg2.tar.xz; then
            sudo mv ffmpeg-*-amd64-static/ffmpeg ffmpeg-*-amd64-static/ffprobe /usr/local/bin/
          else
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          rm -rf ffmpeg*.tar.xz ffmpeg-master-latest-linux64-gpl ffmpeg-*-amd64-static
      - name: Install dependencies
        working-directory: reels
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r requirements.txt
          pip install -q pyyaml google-auth-oauthlib google-api-python-client edge-tts
      - name: Render, approve on Telegram, post
        env:
          TELEGRAM_ALERTS_BOT_TOKEN: ${{ secrets.TELEGRAM_ALERTS_BOT_TOKEN }}
          TELEGRAM_ALERTS_CHAT_ID: ${{ secrets.TELEGRAM_ALERTS_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          ALERT_APPROVE_VIDEO: ${{ vars.ALERT_APPROVE_VIDEO }}
          DRAFT_ID: ${{ needs.bot.outputs.draft }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_NEWSDESK_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_NEWSDESK_CLIENT_SECRET }}
          YT_EN_REFRESH: ${{ secrets[needs.bot.outputs.yt_en] }}
          YT_ES_REFRESH: ${{ secrets[needs.bot.outputs.yt_es] }}
          YT_PT_REFRESH: ${{ secrets[needs.bot.outputs.yt_pt] }}
          YT_ID_REFRESH: ${{ secrets[needs.bot.outputs.yt_id] }}
          INSTAGRAM_EN_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_ES_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_PT_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_ID_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_EN_USER_ID: ${{ secrets[format('{0}_INSTAGRAM_EN_USER_ID', needs.bot.outputs.chk)] }}
          INSTAGRAM_ES_USER_ID: ${{ secrets[format('{0}_INSTAGRAM_ES_USER_ID', needs.bot.outputs.chk)] }}
          FACEBOOK_EN_PAGE_ID: ${{ secrets[format('{0}_FACEBOOK_EN_PAGE_ID', needs.bot.outputs.chk)] }}
          FACEBOOK_ES_PAGE_ID: ${{ secrets[format('{0}_FACEBOOK_ES_PAGE_ID', needs.bot.outputs.chk)] }}
          INSTAGRAM_PT_USER_ID: ${{ secrets[format('{0}_INSTAGRAM_PT_USER_ID', needs.bot.outputs.chk)] }}
          INSTAGRAM_ID_USER_ID: ${{ secrets[format('{0}_INSTAGRAM_ID_USER_ID', needs.bot.outputs.chk)] }}
          FACEBOOK_PT_PAGE_ID: ${{ secrets[format('{0}_FACEBOOK_PT_PAGE_ID', needs.bot.outputs.chk)] }}
          FACEBOOK_ID_PAGE_ID: ${{ secrets[format('{0}_FACEBOOK_ID_PAGE_ID', needs.bot.outputs.chk)] }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 alerts/alerts.py post
