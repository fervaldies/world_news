name: Newsdesk on Telegram (alerts + control desk)

# Runs entirely in this PUBLIC repo (no Actions minutes). Uses its own Telegram bot
# (TELEGRAM_ALERTS_BOT_TOKEN) — Newsdesk never reads it. Only Fer's chat is answered.
#   job "bot":  every 10 min reads Fer's taps; at ALERT_HOURS (Sydney) runs the breaking check;
#               after an alert or a draft it keeps listening live for ALERT_LISTEN_MIN minutes.
#   job "post": only after you ask for videos — checks out the needed private reels repos (GH_PAT), renders,
#               sends the videos to approve, posts, writes news-metrics records (upload scripts).
# Bot state lives in the private news-metrics repo (branch alerts-state, [skip ci] commits).
# Public log shows status lines only; full logs of failures go to Telegram.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      check_now:
        description: "Run the breaking check now"
        type: boolean
        default: false

concurrency:
  group: alerts-bot           # only ONE job may read the bot at a time
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      post: ${{ steps.bot.outputs.post }}
      job: ${{ steps.bot.outputs.job }}
      need_australia: ${{ steps.bot.outputs.need_australia }}
      need_world: ${{ steps.bot.outputs.need_world }}
      need_europe: ${{ steps.bot.outputs.need_europe }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: alerts
      - name: Read taps, check for breaking news, draft
        id: bot
        env:
          TELEGRAM_ALERTS_BOT_TOKEN: ${{ secrets.TELEGRAM_ALERTS_BOT_TOKEN }}
          TELEGRAM_ALERTS_CHAT_ID: ${{ secrets.TELEGRAM_ALERTS_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALERT_HOURS: ${{ vars.ALERT_HOURS }}
          ALERT_LISTEN_MIN: ${{ vars.ALERT_LISTEN_MIN }}
          ALERT_APPROVE_VIDEO: ${{ vars.ALERT_APPROVE_VIDEO }}
          CHECK_NOW: ${{ inputs.check_now }}
          # stage 4: logins for Comments and Part 2 answers (read + reply only; masked in logs)
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_NEWSDESK_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_NEWSDESK_CLIENT_SECRET }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          YT_AUSTRALIA_EN: ${{ secrets.AUSTRALIA_YOUTUBE_REFRESH_TOKEN }}
          IG_AUSTRALIA_EN: ${{ secrets.AUSTRALIA_INSTAGRAM_EN_USER_ID }}
          FB_AUSTRALIA_EN: ${{ secrets.AUSTRALIA_FACEBOOK_EN_PAGE_ID }}
          YT_AUSTRALIA_ES: ${{ secrets.AUSTRALIA_YOUTUBE_REFRESH_TOKEN }}
          IG_AUSTRALIA_ES: ${{ secrets.AUSTRALIA_INSTAGRAM_ES_USER_ID }}
          FB_AUSTRALIA_ES: ${{ secrets.AUSTRALIA_FACEBOOK_ES_PAGE_ID }}
          YT_AUSTRALIA_PT: ${{ secrets.AUSTRALIA_YOUTUBE_PT_REFRESH_TOKEN }}
          IG_AUSTRALIA_PT: ${{ secrets.AUSTRALIA_INSTAGRAM_PT_USER_ID }}
          FB_AUSTRALIA_PT: ${{ secrets.AUSTRALIA_FACEBOOK_PT_PAGE_ID }}
          YT_AUSTRALIA_ID: ${{ secrets.AUSTRALIA_YOUTUBE_ID_REFRESH_TOKEN }}
          IG_AUSTRALIA_ID: ${{ secrets.AUSTRALIA_INSTAGRAM_ID_USER_ID }}
          FB_AUSTRALIA_ID: ${{ secrets.AUSTRALIA_FACEBOOK_ID_PAGE_ID }}
          YT_WORLD_EN: ${{ secrets.WORLD_YOUTUBE_EN_REFRESH_TOKEN }}
          IG_WORLD_EN: ${{ secrets.WORLD_INSTAGRAM_EN_USER_ID }}
          FB_WORLD_EN: ${{ secrets.WORLD_FACEBOOK_EN_PAGE_ID }}
          YT_WORLD_ES: ${{ secrets.WORLD_YOUTUBE_ES_REFRESH_TOKEN }}
          IG_WORLD_ES: ${{ secrets.WORLD_INSTAGRAM_ES_USER_ID }}
          FB_WORLD_ES: ${{ secrets.WORLD_FACEBOOK_ES_PAGE_ID }}
          YT_WORLD_PT: ${{ secrets.WORLD_YOUTUBE_PT_REFRESH_TOKEN }}
          IG_WORLD_PT: ${{ secrets.WORLD_INSTAGRAM_PT_USER_ID }}
          FB_WORLD_PT: ${{ secrets.WORLD_FACEBOOK_PT_PAGE_ID }}
          YT_WORLD_ID: ${{ secrets.WORLD_YOUTUBE_ID_REFRESH_TOKEN }}
          IG_WORLD_ID: ${{ secrets.WORLD_INSTAGRAM_ID_USER_ID }}
          FB_WORLD_ID: ${{ secrets.WORLD_FACEBOOK_ID_PAGE_ID }}
          YT_EUROPE_EN: ${{ secrets.EUROPE_YOUTUBE_EN_REFRESH_TOKEN }}
          IG_EUROPE_EN: ${{ secrets.EUROPE_INSTAGRAM_EN_USER_ID }}
          FB_EUROPE_EN: ${{ secrets.EUROPE_FACEBOOK_EN_PAGE_ID }}
          YT_EUROPE_ES: ${{ secrets.EUROPE_YOUTUBE_ES_REFRESH_TOKEN }}
          IG_EUROPE_ES: ${{ secrets.EUROPE_INSTAGRAM_ES_USER_ID }}
          FB_EUROPE_ES: ${{ secrets.EUROPE_FACEBOOK_ES_PAGE_ID }}
          YT_EUROPE_PT: ${{ secrets.EUROPE_YOUTUBE_PT_REFRESH_TOKEN }}
          IG_EUROPE_PT: ${{ secrets.EUROPE_INSTAGRAM_PT_USER_ID }}
          FB_EUROPE_PT: ${{ secrets.EUROPE_FACEBOOK_PT_PAGE_ID }}
          YT_EUROPE_ID: ${{ secrets.EUROPE_YOUTUBE_ID_REFRESH_TOKEN }}
          IG_EUROPE_ID: ${{ secrets.EUROPE_INSTAGRAM_ID_USER_ID }}
          FB_EUROPE_ID: ${{ secrets.EUROPE_FACEBOOK_ID_PAGE_ID }}
        run: |
          pip install -q pyyaml
          python3 alerts/alerts.py bot

  post:
    needs: bot
    if: needs.bot.outputs.post == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: alerts
      - name: Check out australia (videos, music, scripts — private repo)
        if: needs.bot.outputs.need_australia == 'true'
        uses: actions/checkout@v4
        with:
          repository: fervaldies/australia-news-reels
          token: ${{ secrets.GH_PAT }}
          path: reels_australia
      - name: Check out world (videos, music, scripts — private repo)
        if: needs.bot.outputs.need_world == 'true'
        uses: actions/checkout@v4
        with:
          repository: fervaldies/world-news-reels
          token: ${{ secrets.GH_PAT }}
          path: reels_world
      - name: Check out europe (videos, music, scripts — private repo)
        if: needs.bot.outputs.need_europe == 'true'
        uses: actions/checkout@v4
        with:
          repository: fervaldies/europe-news-reels
          token: ${{ secrets.GH_PAT }}
          path: reels_europe
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        timeout-minutes: 5
        run: |
          CURL="curl -fsSL --connect-timeout 20 --max-time 180 --retry 3 --retry-delay 5 --retry-all-errors"
          if $CURL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -o ffmpeg.tar.xz && tar -xf ffmpeg.tar.xz; then
            sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          elif $CURL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o ffmpeg2.tar.xz && tar -xf ffmpeg2.tar.xz; then
            sudo mv ffmpeg-*-amd64-static/ffmpeg ffmpeg-*-amd64-static/ffprobe /usr/local/bin/
          else
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          rm -rf ffmpeg*.tar.xz ffmpeg-master-latest-linux64-gpl ffmpeg-*-amd64-static
      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          for d in reels_*; do [ -f "$d/requirements.txt" ] && pip install -q -r "$d/requirements.txt"; done
          pip install -q pyyaml google-auth-oauthlib google-api-python-client edge-tts
      - name: Make the videos, approve on Telegram, post
        env:
          TELEGRAM_ALERTS_BOT_TOKEN: ${{ secrets.TELEGRAM_ALERTS_BOT_TOKEN }}
          TELEGRAM_ALERTS_CHAT_ID: ${{ secrets.TELEGRAM_ALERTS_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          ALERT_APPROVE_VIDEO: ${{ vars.ALERT_APPROVE_VIDEO }}
          JOB_ID: ${{ needs.bot.outputs.job }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_NEWSDESK_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_NEWSDESK_CLIENT_SECRET }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          YT_AUSTRALIA_EN: ${{ secrets.AUSTRALIA_YOUTUBE_REFRESH_TOKEN }}
          IG_AUSTRALIA_EN: ${{ secrets.AUSTRALIA_INSTAGRAM_EN_USER_ID }}
          FB_AUSTRALIA_EN: ${{ secrets.AUSTRALIA_FACEBOOK_EN_PAGE_ID }}
          YT_AUSTRALIA_ES: ${{ secrets.AUSTRALIA_YOUTUBE_REFRESH_TOKEN }}
          IG_AUSTRALIA_ES: ${{ secrets.AUSTRALIA_INSTAGRAM_ES_USER_ID }}
          FB_AUSTRALIA_ES: ${{ secrets.AUSTRALIA_FACEBOOK_ES_PAGE_ID }}
          YT_AUSTRALIA_PT: ${{ secrets.AUSTRALIA_YOUTUBE_PT_REFRESH_TOKEN }}
          IG_AUSTRALIA_PT: ${{ secrets.AUSTRALIA_INSTAGRAM_PT_USER_ID }}
          FB_AUSTRALIA_PT: ${{ secrets.AUSTRALIA_FACEBOOK_PT_PAGE_ID }}
          YT_AUSTRALIA_ID: ${{ secrets.AUSTRALIA_YOUTUBE_ID_REFRESH_TOKEN }}
          IG_AUSTRALIA_ID: ${{ secrets.AUSTRALIA_INSTAGRAM_ID_USER_ID }}
          FB_AUSTRALIA_ID: ${{ secrets.AUSTRALIA_FACEBOOK_ID_PAGE_ID }}
          YT_WORLD_EN: ${{ secrets.WORLD_YOUTUBE_EN_REFRESH_TOKEN }}
          IG_WORLD_EN: ${{ secrets.WORLD_INSTAGRAM_EN_USER_ID }}
          FB_WORLD_EN: ${{ secrets.WORLD_FACEBOOK_EN_PAGE_ID }}
          YT_WORLD_ES: ${{ secrets.WORLD_YOUTUBE_ES_REFRESH_TOKEN }}
          IG_WORLD_ES: ${{ secrets.WORLD_INSTAGRAM_ES_USER_ID }}
          FB_WORLD_ES: ${{ secrets.WORLD_FACEBOOK_ES_PAGE_ID }}
          YT_WORLD_PT: ${{ secrets.WORLD_YOUTUBE_PT_REFRESH_TOKEN }}
          IG_WORLD_PT: ${{ secrets.WORLD_INSTAGRAM_PT_USER_ID }}
          FB_WORLD_PT: ${{ secrets.WORLD_FACEBOOK_PT_PAGE_ID }}
          YT_WORLD_ID: ${{ secrets.WORLD_YOUTUBE_ID_REFRESH_TOKEN }}
          IG_WORLD_ID: ${{ secrets.WORLD_INSTAGRAM_ID_USER_ID }}
          FB_WORLD_ID: ${{ secrets.WORLD_FACEBOOK_ID_PAGE_ID }}
          YT_EUROPE_EN: ${{ secrets.EUROPE_YOUTUBE_EN_REFRESH_TOKEN }}
          IG_EUROPE_EN: ${{ secrets.EUROPE_INSTAGRAM_EN_USER_ID }}
          FB_EUROPE_EN: ${{ secrets.EUROPE_FACEBOOK_EN_PAGE_ID }}
          YT_EUROPE_ES: ${{ secrets.EUROPE_YOUTUBE_ES_REFRESH_TOKEN }}
          IG_EUROPE_ES: ${{ secrets.EUROPE_INSTAGRAM_ES_USER_ID }}
          FB_EUROPE_ES: ${{ secrets.EUROPE_FACEBOOK_ES_PAGE_ID }}
          YT_EUROPE_PT: ${{ secrets.EUROPE_YOUTUBE_PT_REFRESH_TOKEN }}
          IG_EUROPE_PT: ${{ secrets.EUROPE_INSTAGRAM_PT_USER_ID }}
          FB_EUROPE_PT: ${{ secrets.EUROPE_FACEBOOK_PT_PAGE_ID }}
          YT_EUROPE_ID: ${{ secrets.EUROPE_YOUTUBE_ID_REFRESH_TOKEN }}
          IG_EUROPE_ID: ${{ secrets.EUROPE_INSTAGRAM_ID_USER_ID }}
          FB_EUROPE_ID: ${{ secrets.EUROPE_FACEBOOK_ID_PAGE_ID }}
        run: python3 alerts/alerts.py post
