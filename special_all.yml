world:
  title_en: "World News\nSpecial Edition\nUS Ground Stop\nNovember 14, 2026"
  title_es: "Noticias del Mundo\nEdición Especial\nApagón aéreo\n14 de noviembre de 2026"
  title_pt: "Notícias do Mundo\nEdição Especial\nApagão aéreo\n14 de novembro de 2026"
  title_id: "Berita Dunia\nEdisi Khusus\nPenerbangan AS Lumpuh\n14 November 2026"
  news_en:
    - "The FAA has halted all departing flights across the US after a nationwide air traffic communications outage."
    - "Officials say a telecommunications outage hit all 22 regional air traffic control centers."
    - "The ground stop has reportedly been extended to 11:30 p.m. Eastern, with no confirmed restart time."
    - "Nearly 7,000 flights delayed or canceled as inbound international flights are handled case by case."
    - "Homeland Security sees no sign of a threat in only the third nationwide ground stop ever."
  news_es:
    - "La FAA paraliza todos los despegues en EE. UU. por un fallo de comunicaciones del control aéreo."
    - "Las autoridades atribuyen el fallo a un corte de telecomunicaciones en los 22 centros regionales de control."
    - "La suspensión se habría ampliado hasta las 23:30, hora del Este, sin hora confirmada de reanudación."
    - "Casi 7.000 vuelos retrasados o cancelados; los vuelos internacionales entrantes se gestionan caso por caso."
    - "Seguridad Nacional no ve indicios de amenaza en la tercera paralización aérea total de la historia."
  news_pt:
    - "FAA suspende todas as decolagens nos EUA após falha nas comunicações do controle aéreo."
    - "Autoridades atribuem a falha a uma pane de telecomunicações nos 22 centros regionais de controle."
    - "Suspensão teria sido prorrogada até 23h30, horário do leste dos EUA, sem previsão confirmada de retomada."
    - "Quase 7 mil voos atrasados ou cancelados; voos internacionais de chegada são avaliados caso a caso."
    - "Segurança Interna não vê sinais de ameaça na terceira paralisação aérea nacional da história."
  news_id:
    - "FAA hentikan semua penerbangan berangkat di AS akibat gangguan komunikasi pengatur lalu lintas udara."
    - "Pejabat sebut gangguan telekomunikasi melanda 22 pusat pengatur lalu lintas udara regional."
    - "Penghentian dikabarkan diperpanjang hingga pukul 23.30 waktu timur AS, belum ada waktu pasti penerbangan dilanjutkan."
    - "Hampir 7.000 penerbangan tertunda atau batal, penerbangan internasional masuk ditangani kasus per kasus."
    - "Keamanan Dalam Negeri AS tak melihat tanda ancaman dalam penghentian nasional ketiga sepanjang sejarah."