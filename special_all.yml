australia:
  title_en: "Australia News\nSpecial Edition\nMicrosoft Outage\nNovember 14, 2026"
  title_es: "Noticias de Australia\nEdición Especial\nCaída de Microsoft\n14 de noviembre de 2026"
  title_pt: "Notícias da Austrália\nEdição Especial\nPane da Microsoft\n14 de novembro de 2026"
  title_id: "Berita Australia\nEdisi Khusus\nGangguan Microsoft\n14 November 2026"
  news_en:
    - "Microsoft outage cuts Australians off from Outlook, Teams and Authenticator for more than 17 hours"
    - "Tony Burke says Microsoft believes a faulty update, not a cyberattack, caused the outage"
    - "Australia's spy agency and federal police reportedly hit, but Services Australia payments unaffected"
    - "VCE students report losing teacher help mid-exams as TAFE NSW classes on Teams are disrupted"
    - "Some small businesses lost up to $30,000 in a day, while telehealth services were disrupted"
  news_es:
    - "La caída de Microsoft deja a los australianos sin Outlook, Teams ni Authenticator más de 17 horas"
    - "Tony Burke afirma que Microsoft atribuye el fallo a una actualización defectuosa, no a un ciberataque"
    - "Los servicios de inteligencia y la policía federal, al parecer afectados; los pagos de Services Australia, intactos"
    - "Alumnos de VCE dicen quedarse sin ayuda docente en plenos exámenes; caen clases de TAFE NSW"
    - "Algunas pymes pierden hasta 30.000 dólares australianos en un día y caen consultas de telemedicina"
  news_pt:
    - "Pane da Microsoft deixa australianos sem Outlook, Teams e Authenticator por mais de 17 horas"
    - "Tony Burke diz que Microsoft atribui a falha a uma atualização defeituosa, não a ataque cibernético"
    - "Agência de inteligência e polícia federal teriam sido afetadas; pagamentos do Services Australia seguem normais"
    - "Alunos do VCE relatam ficar sem apoio de professores em plenas provas; aulas do TAFE NSW falham"
    - "Pequenas empresas perderam até 30 mil dólares australianos em um dia, e teleconsultas foram interrompidas"
  news_id:
    - "Gangguan Microsoft membuat warga Australia tak bisa mengakses Outlook, Teams, dan Authenticator lebih dari 17 jam"
    - "Tony Burke menyebut Microsoft meyakini pembaruan bermasalah, bukan serangan siber, sebagai penyebab gangguan"
    - "Badan intelijen dan polisi federal dilaporkan terdampak, pembayaran Services Australia tetap normal"
    - "Siswa VCE mengaku kehilangan bantuan guru di tengah ujian, kelas TAFE NSW di Teams terganggu"
    - "Sejumlah usaha kecil merugi hingga 30.000 dolar Australia sehari, layanan telehealth ikut terganggu"
world:
  title_en: "World News\nSpecial Edition\nGlobal Outages\nNovember 14, 2026"
  title_es: "Noticias del Mundo\nEdición Especial\nApagón digital\n14 de noviembre de 2026"
  title_pt: "Notícias do Mundo\nEdição Especial\nApagão digital\n14 de novembro de 2026"
  title_id: "Berita Dunia\nEdisi Khusus\nGangguan Global\n14 November 2026"
  news_en:
    - "Microsoft 365 outage knocks out Outlook, Teams and Copilot in 74 countries for nearly a day"
    - "Microsoft blames an issue during a network capacity upgrade and says it found no malicious activity"
    - "Some firms reverted to fax machines, and at least one bond repurchase in Europe was halted"
    - "US grounds all departing flights for over four hours after an air traffic control telecom outage"
    - "About 7,000 US flights delayed or cancelled as officials see no indication of an attack"
  news_es:
    - "Una caída de Microsoft 365 tumba Outlook, Teams y Copilot en 74 países durante casi un día"
    - "Microsoft atribuye el fallo a una ampliación de capacidad de red y descarta actividad maliciosa"
    - "Algunas empresas vuelven al fax y al menos una recompra de bonos en Europa queda paralizada"
    - "EE. UU. paraliza todos los despegues más de cuatro horas por un fallo en el control aéreo"
    - "Unos 7.000 vuelos retrasados o cancelados en EE. UU.; las autoridades no ven indicios de ataque"
  news_pt:
    - "Pane do Microsoft 365 derruba Outlook, Teams e Copilot em 74 países por quase um dia"
    - "Microsoft atribui a falha a uma ampliação de capacidade da rede e descarta atividade maliciosa"
    - "Empresas voltam ao fax e ao menos uma recompra de títulos na Europa é suspensa"
    - "EUA suspendem todas as decolagens por mais de quatro horas após pane de telecomunicações no controle aéreo"
    - "Cerca de 7.000 voos atrasados ou cancelados nos EUA; autoridades não veem indício de ataque"
  news_id:
    - "Gangguan Microsoft 365 melumpuhkan Outlook, Teams, dan Copilot di 74 negara selama hampir sehari"
    - "Microsoft menyebut gangguan dipicu peningkatan kapasitas jaringan dan tidak menemukan aktivitas berbahaya"
    - "Sejumlah perusahaan kembali memakai faks, setidaknya satu pembelian kembali obligasi di Eropa terhenti"
    - "AS menghentikan semua keberangkatan pesawat lebih dari empat jam akibat gangguan telekomunikasi lalu lintas udara"
    - "Sekitar 7.000 penerbangan di AS tertunda atau batal; pejabat tak melihat indikasi serangan"
europe:
  title_en: "Europe News\nSpecial Edition\nMicrosoft Outage\nNovember 14, 2026"
  title_es: "Noticias de Europa\nEdición Especial\nCaída de Microsoft\n14 de noviembre de 2026"
  title_pt: "Notícias da Europa\nEdição Especial\nPane da Microsoft\n14 de novembro de 2026"
  title_id: "Berita Eropa\nEdisi Khusus\nGangguan Microsoft\n14 November 2026"
  news_en:
    - "Microsoft outage disrupts Outlook and Teams across Europe for nearly 24 hours"
    - "NHS and London's Metropolitan Police among UK organisations hit by the outage"
    - "A trial in Manchester is halted as the outage hits Britain"
    - "At least one bond repurchase in Europe halted, while Deutsche Bank's email was reportedly patchy"
    - "EU institutions largely unaffected, but outage fuels calls for European digital sovereignty"
  news_es:
    - "La caída de Microsoft afecta a Outlook y Teams en toda Europa durante casi 24 horas"
    - "El NHS y la Policía Metropolitana de Londres, entre las organizaciones británicas afectadas"
    - "La caída obliga a suspender un juicio en Mánchester"
    - "Al menos una recompra de bonos en Europa, paralizada; el correo de Deutsche Bank habría fallado"
    - "Las instituciones de la UE, casi intactas; la caída reaviva el debate sobre la soberanía digital"
  news_pt:
    - "Pane da Microsoft afeta Outlook e Teams em toda a Europa por quase 24 horas"
    - "NHS e Polícia Metropolitana de Londres estão entre as organizações britânicas atingidas"
    - "Pane provoca a suspensão de um julgamento em Manchester, no Reino Unido"
    - "Ao menos uma recompra de títulos na Europa é suspensa; e-mail do Deutsche Bank teria falhado"
    - "Instituições da UE quase não são afetadas, mas pane reacende debate sobre soberania digital europeia"
  news_id:
    - "Gangguan Microsoft melumpuhkan Outlook dan Teams di seluruh Eropa selama hampir 24 jam"
    - "NHS dan Kepolisian Metropolitan London termasuk organisasi Inggris yang terdampak"
    - "Gangguan membuat sebuah persidangan di Manchester terhenti"
    - "Setidaknya satu pembelian kembali obligasi di Eropa terhenti, email Deutsche Bank dilaporkan tersendat"
    - "Lembaga UE nyaris tak terdampak, tetapi gangguan memicu seruan kedaulatan digital Eropa"