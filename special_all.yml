    - "La venta de agua embotellada subió un 67 % en Reino Unido en 10 días de campaña"
    - "El temor a conflictos, ciberataques y clima extremo impulsa las llamadas a prepararse"
    - "Japón aconseja guardar provisiones para al menos tres días, idealmente una semana"
