australia:
  title_en: "Australia News\nSpecial Edition\nQantas Job Cuts\nNovember 11, 2026"
  title_es: "Noticias de Australia\nEdición Especial\nDespidos en Qantas\n11 de noviembre de 2026"
  title_pt: "Notícias da Austrália\nEdição Especial\nCortes na Qantas\n11 de novembro de 2026"
  title_id: "Berita Australia\nEdisi Khusus\nPHK Qantas\n11 November 2026"
  news_en:
    - "Qantas to cut about 850 corporate jobs as AI and Accenture deal reshape its workforce"
    - "Most affected roles are in Sydney, across finance, procurement, human resources and marketing"
    - "Union says it was told no jobs would go offshore;  Qantas disputes that claim"
    - "Qantas says first changes start mid-2027 and it will try to redeploy affected staff"
    - "Qantas, Canva and NAB have targeted about 4,550 corporate jobs for cuts or changes in a month"
  news_es:
    - "Qantas suprimirá unos 850 empleos corporativos mientras la IA y un acuerdo con Accenture transforman su plantilla"
    - "La mayoría de los puestos afectados están en Sydney, en finanzas, compras, recursos humanos y marketing"
    - "El sindicato asegura que le dijeron que no habría deslocalización; Qantas lo rebate"
    - "Qantas dice que los primeros cambios llegarán a mediados de 2027 e intentará recolocar a la plantilla afectada"
    - "Qantas, Canva y NAB han señalado unos 4.550 empleos corporativos para recortes o cambios en un mes"
  news_pt:
    - "Qantas cortará cerca de 850 vagas corporativas enquanto IA e acordo com Accenture remodelam a empresa"
    - "Maioria dos cargos afetados fica em Sydney, nas áreas de finanças, compras, recursos humanos e marketing"
    - "Sindicato diz que ouviu que não haveria envio de vagas ao exterior; Qantas contesta"
    - "Qantas diz que primeiras mudanças começam em meados de 2027 e tentará realocar funcionários afetados"
    - "Qantas, Canva e NAB miraram cerca de 4.550 vagas corporativas para cortes ou mudanças em um mês"
  news_id:
    - "Qantas akan pangkas sekitar 850 pekerjaan korporat seiring AI dan kesepakatan Accenture ubah tenaga kerjanya"
    - "Sebagian besar posisi terdampak ada di Sydney, di bidang keuangan, pengadaan, SDM, dan pemasaran"
    - "Serikat pekerja mengaku dijanjikan tak ada pekerjaan dialihkan ke luar negeri; Qantas membantahnya"
    - "Qantas sebut perubahan pertama mulai pertengahan 2027 dan akan berupaya menempatkan ulang staf terdampak"
    - "Qantas, Canva, dan NAB menyasar sekitar 4.550 pekerjaan korporat untuk dipangkas atau diubah dalam sebulan"
world:
  title_en: "World News\nSpecial Edition\nAI Job Cuts\nNovember 11, 2026"
  title_es: "Noticias del Mundo\nEdición Especial\nDespidos por IA\n11 de noviembre de 2026"
  title_pt: "Notícias do Mundo\nEdição Especial\nCortes por IA\n11 de novembro de 2026"
  title_id: "Berita Dunia\nEdisi Khusus\nPHK karena AI\n11 November 2026"
  news_en:
    - "Qantas will cut about 850 corporate roles in an AI-driven deal with Accenture"
    - "Most of the outsourced work will move to Accenture teams in India from mid-2027"
    - "Qantas CEO calls AI change unprecedented, saying standing still is not an option"
    - "Microsoft offers voluntary buyouts to about 60,000 staff as it spends heavily on AI"
    - "AI is the most-cited reason for announced US job cuts this year, at about 21%"
  news_es:
    - "Qantas recortará unos 850 puestos corporativos en un acuerdo con Accenture impulsado por la IA"
    - "La mayor parte del trabajo pasará a equipos de Accenture en India desde mediados de 2027"
    - "La consejera delegada de Qantas califica de inédito el cambio por la IA y descarta quedarse quieta"
    - "Microsoft ofrece bajas voluntarias a unos 60.000 empleados mientras invierte con fuerza en IA"
    - "La IA es el motivo de despido más citado en EE. UU. este año, con cerca del 21 %"
  news_pt:
    - "Qantas vai cortar cerca de 850 cargos corporativos em acordo com a Accenture impulsionado por IA"
    - "Maior parte do trabalho vai para equipes da Accenture na Índia a partir de meados de 2027"
    - "CEO da Qantas vê mudança inédita com a IA e diz que ficar parado não é opção"
    - "Microsoft oferece demissão voluntária a cerca de 60 mil funcionários enquanto investe pesado em IA"
    - "IA é o motivo mais citado para demissões anunciadas nos EUA neste ano, com cerca de 21%"
  news_id:
    - "Qantas akan memangkas sekitar 850 posisi korporat lewat kesepakatan berbasis AI dengan Accenture"
    - "Sebagian besar pekerjaan akan dialihkan ke tim Accenture di India mulai pertengahan 2027"
    - "CEO Qantas sebut perubahan akibat AI belum pernah terjadi dan berdiam diri bukan pilihan"
    - "Microsoft tawarkan pengunduran diri sukarela kepada sekitar 60.000 karyawan di tengah belanja besar AI"
    - "AI jadi alasan paling sering disebut dalam PHK yang diumumkan di AS tahun ini, sekitar 21 persen"
europe:
  title_en: "Europe News\nSpecial Edition\nAI Job Cuts\nNovember 11, 2026"
  title_es: "Noticias de Europa\nEdición Especial\nDespidos por IA\n11 de noviembre de 2026"
  title_pt: "Notícias da Europa\nEdição Especial\nCortes por IA\n11 de novembro de 2026"
  title_id: "Berita Eropa\nEdisi Khusus\nPHK karena AI\n11 November 2026"
  news_en:
    - "Barclays plans about 5,000 job cuts this year, citing AI-driven efficiency among the reasons"
    - "UK union Unite accuses Barclays of using AI to justify job losses"
    - "The Netherlands plans 25,000 fewer central government jobs by 2035, with AI among the tools"
    - "Nuremberg-based software firm SUSE cuts about 10% of staff, with its CEO citing AI"
    - "Lufthansa has begun its plan to cut 4,000 admin jobs by 2030, partly through AI"
  news_es:
    - "Barclays prevé recortar unos 5.000 empleos este año y apunta a la eficiencia de la IA"
    - "El sindicato británico Unite acusa a Barclays de usar la IA para justificar despidos"
    - "Países Bajos planea 25.000 empleos menos en la administración central para 2035, con la IA entre sus herramientas"
    - "SUSE, con sede en Nuremberg, recorta cerca del 10 % de la plantilla y alude a la IA"
    - "Lufthansa ya aplica su plan de recortar 4.000 puestos administrativos hasta 2030, en parte con IA"
  news_pt:
    - "Barclays prevê cortar cerca de 5 mil vagas neste ano, citando ganhos de eficiência com IA"
    - "Sindicato britânico Unite acusa o Barclays de usar a IA para justificar demissões"
    - "Holanda planeja cortar 25 mil cargos no governo central até 2035, com IA entre as ferramentas"
    - "SUSE, com sede em Nuremberg, corta cerca de 10% dos funcionários, e CEO cita a IA"
    - "Lufthansa já começou plano de cortar 4 mil cargos administrativos até 2030, em parte com IA"
  news_id:
    - "Barclays berencana memangkas sekitar 5.000 pekerjaan tahun ini, salah satunya karena efisiensi AI"
    - "Serikat pekerja Inggris Unite tuding Barclays memakai AI untuk membenarkan PHK"
    - "Belanda berencana kurangi 25.000 jabatan pemerintah pusat hingga 2035, AI jadi salah satu alatnya"
    - "SUSE yang bermarkas di Nuremberg pangkas sekitar 10 persen staf, CEO-nya singgung AI"
    - "Lufthansa mulai jalankan rencana pangkas 4.000 jabatan administrasi hingga 2030, sebagian lewat AI"
