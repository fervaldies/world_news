world:
  title_en: "World News\nSpecial Edition\nRonaldinho Returns\nNovember 15, 2026"
  title_es: "Noticias del Mundo\nEdición Especial\nVuelve Ronaldinho\n15 de noviembre de 2026"
  title_pt: "Notícias do Mundo\nEdição Especial\nVolta de Ronaldinho\n15 de novembro de 2026"
  title_id: "Berita Dunia\nEdisi Khusus\nRonaldinho Kembali\n15 November 2026"
  news_en:
    - "Ronaldinho, 46, plays his first competitive match in 11 years for Italy's Ravenna on Sunday."
    - "Coach Andrea Mandorlini confirms Ronaldinho will start the Serie C derby against Forli."
    - "The Brazil great is chasing his 300th senior goal after retiring with 299."
    - "Ronaldinho also holds an ownership stake in Ravenna, the club owned by his friend Ignazio Cipriani."
    - "The derby will be streamed worldwide, with live coverage in Italy and the United States."
  news_es:
    - "Ronaldinho, con 46 años, disputa el domingo con el Ravenna su primer partido oficial en 11 años."
    - "Andrea Mandorlini confirma que Ronaldinho será titular en el derbi de la Serie C ante el Forli."
    - "La leyenda brasileña persigue su gol número 300 tras retirarse con 299."
    - "Ronaldinho también es accionista del Ravenna, propiedad de su amigo Ignazio Cipriani."
    - "El derbi se verá en todo el mundo, con retransmisión en directo en Italia y Estados Unidos."
  news_pt:
    - "Ronaldinho, aos 46 anos, faz no domingo pelo Ravenna sua primeira partida oficial em 11 anos."
    - "O técnico Andrea Mandorlini confirma Ronaldinho como titular no clássico da Serie C contra o Forli."
    - "O craque brasileiro busca seu 300º gol na carreira, após se aposentar com 299."
    - "Ronaldinho também é acionista do Ravenna, clube de seu amigo Ignazio Cipriani."
    - "O clássico terá transmissão para o mundo todo, com exibição ao vivo na Itália e nos EUA."
  news_id:
    - "Ronaldinho, 46 tahun, jalani laga resmi pertamanya dalam 11 tahun bersama Ravenna pada Minggu."
    - "Pelatih Andrea Mandorlini pastikan Ronaldinho jadi starter dalam derbi Serie C melawan Forli."
    - "Legenda Brasil itu memburu gol ke-300 dalam kariernya setelah pensiun dengan 299 gol."
    - "Ronaldinho juga memegang saham di Ravenna, klub milik sahabatnya Ignazio Cipriani."
    - "Derbi ini disiarkan ke seluruh dunia, termasuk siaran langsung di Italia dan Amerika Serikat."
europe:
  title_en: "Europe News\nSpecial Edition\nRonaldinho Returns\nNovember 15, 2026"
  title_es: "Noticias de Europa\nEdición Especial\nVuelve Ronaldinho\n15 de noviembre de 2026"
  title_pt: "Notícias da Europa\nEdição Especial\nVolta de Ronaldinho\n15 de novembro de 2026"
  title_id: "Berita Eropa\nEdisi Khusus\nRonaldinho Kembali\n15 November 2026"
  news_en:
    - "Ronaldinho returns to Italian football at 46, starting for Ravenna in Sunday's derby against Forli."
    - "Ravenna's Stadio Benelli sold out within minutes, with tickets priced from 15 to 150 euros."
    - "Ravenna built a temporary stand to expand the Benelli for the crowds expected."
    - "Ravenna sit second in Serie C Group B, aiming for Serie B for the first time since 2008."
    - "Ronaldinho landed from Barcelona on Friday, 16 years after his last Italian match for AC Milan."
  news_es:
    - "Ronaldinho vuelve al fútbol italiano a los 46 y será titular con el Ravenna ante el Forli."
    - "Las entradas del Stadio Benelli se agotaron en minutos, con precios de 15 a 150 euros."
    - "El Ravenna instaló una grada provisional para ampliar el Benelli ante la afluencia prevista."
    - "El Ravenna, segundo del Grupo B, sueña con su primer ascenso a la Serie B desde 2008."
    - "Ronaldinho llegó el viernes desde Barcelona, 16 años después de su último partido con el AC Milan."
  news_pt:
    - "Ronaldinho volta ao futebol italiano aos 46 anos e será titular do Ravenna contra o Forli."
    - "Os ingressos do Stadio Benelli esgotaram em minutos, com preços de 15 a 150 euros."
    - "O Ravenna montou uma arquibancada provisória para ampliar o Benelli diante do público esperado."
    - "Vice-líder do Grupo B, o Ravenna sonha com o primeiro acesso à Serie B desde 2008."
    - "Ronaldinho chegou de Barcelona na sexta, 16 anos após seu último jogo na Itália pelo AC Milan."
  news_id:
    - "Ronaldinho kembali ke sepak bola Italia di usia 46 tahun, jadi starter Ravenna melawan Forli."
    - "Tiket Stadio Benelli ludes dalam hitungan menit, dengan harga 15 hingga 150 euro."
    - "Ravenna membangun tribun sementara untuk memperluas Benelli demi menampung penonton."
    - "Peringkat kedua Grup B, Ravenna mengincar promosi ke Serie B untuk pertama kali sejak 2008."
    - "Ronaldinho tiba dari Barcelona pada Jumat, 16 tahun setelah laga terakhirnya di Italia bersama AC Milan."