australia:
  title_en: "Australia News\nSpecial Edition\nNvidia Spy Scandal\nNovember 11, 2026"
  title_es: "Noticias de Australia\nEdición Especial\nEspionaje en Nvidia\n11 de noviembre de 2026"
  title_pt: "Notícias da Austrália\nEdição Especial\nEspionagem na Nvidia\n11 de novembro de 2026"
  title_id: "Berita Australia\nEdisi Khusus\nSkandal Mata-mata Nvidia\n11 November 2026"
  news_en:
    - "Nvidia spy scandal reaches Australia as filings reveal Megaspeed's local subsidiary"
    - "Megaspeed Australia, registered in 2024, lists its business address at 20 Martin Place in Sydney"
    - "Its sole director is a 29-year-old newsagent worker listed at a shop in Seymour, Victoria"
    - "Alice Huang, the alleged Chinese spy, has reportedly visited Australia in the past"
    - "ASIO declines to comment as Nvidia's two-day slide wipes about A$625 billion off its value"
  news_es:
    - "El escándalo de espionaje de Nvidia llega a Australia: Megaspeed tiene una filial en el país"
    - "Megaspeed Australia, registrada en 2024, tiene su domicilio en el número 20 de Martin Place, en Sídney"
    - "Su único administrador es un empleado de 29 años de un quiosco de Seymour, en Victoria"
    - "Alice Huang, la presunta espía china, habría visitado Australia en el pasado"
    - "La ASIO guarda silencio mientras Nvidia pierde unos 625.000 millones de dólares australianos en dos días"
  news_pt:
    - "Escândalo de espionagem da Nvidia chega à Austrália com revelação de subsidiária local da Megaspeed"
    - "Megaspeed Australia, registrada em 2024, tem endereço no número 20 da Martin Place, em Sydney"
    - "Seu único diretor é um funcionário de banca de jornal de 29 anos em Seymour, Victoria"
    - "Alice Huang, a suposta espiã chinesa, teria visitado a Austrália no passado"
    - "ASIO não comenta enquanto a Nvidia perde cerca de A$ 625 bilhões em valor em dois dias"
  news_id:
    - "Skandal mata-mata Nvidia merambah Australia setelah dokumen ungkap anak usaha lokal Megaspeed"
    - "Megaspeed Australia, terdaftar sejak 2024, beralamat di 20 Martin Place, Sydney"
    - "Direktur tunggalnya pekerja agen koran berusia 29 tahun yang beralamat di Seymour, Victoria"
    - "Alice Huang, terduga mata-mata China, dilaporkan pernah berkunjung ke Australia"
    - "ASIO enggan berkomentar, sementara nilai Nvidia anjlok sekitar 625 miliar dolar Australia dalam dua hari"
world:
  title_en: "World News\nSpecial Edition\nNvidia Spy Scandal\nNovember 11, 2026"
  title_es: "Noticias del Mundo\nEdición Especial\nEspionaje en Nvidia\n11 de noviembre de 2026"
  title_pt: "Notícias do Mundo\nEdição Especial\nEspionagem na Nvidia\n11 de novembro de 2026"
  title_id: "Berita Dunia\nEdisi Khusus\nSkandal Mata-mata Nvidia\n11 November 2026"
  news_en:
    - "Nvidia board opens independent probe after CEO Jensen Huang admits affair with suspected Chinese spy"
    - "US intelligence reportedly says Alice Huang spied for China; Beijing calls the claims groundless"
    - "Nvidia shares fall for a second day, briefly dipping below $4 trillion in value"
    - "Alice Huang reportedly helped at least $7.5 billion in Nvidia chips reach China"
    - "Trump says the FBI is investigating as US lawmakers seek a closed-door briefing from Huang"
  news_es:
    - "El consejo de Nvidia investiga a Jensen Huang, que admite una aventura con una presunta espía china"
    - "Alice Huang habría espiado para China, según la inteligencia de EE. UU.; Pekín lo tacha de infundado"
    - "Nvidia cae en bolsa por segundo día y vale brevemente menos de 4 billones de dólares"
    - "Alice Huang habría facilitado envíos a China de al menos 7.500 millones de dólares en chips Nvidia"
    - "Trump afirma que el FBI investiga y el Congreso pide a Huang comparecer a puerta cerrada"
  news_pt:
    - "Conselho da Nvidia abre investigação independente após CEO Jensen Huang admitir caso com suposta espiã chinesa"
    - "Inteligência dos EUA teria identificado Alice Huang como espiã da China; Pequim chama acusação de infundada"
    - "Ações da Nvidia caem pelo segundo dia, e valor fica brevemente abaixo de US$ 4 trilhões"
    - "Alice Huang teria ajudado a levar à China pelo menos US$ 7,5 bilhões em chips da Nvidia"
    - "Trump diz que FBI investiga; congressistas pedem reunião a portas fechadas com Huang"
  news_id:
    - "Dewan direksi Nvidia buka penyelidikan independen setelah CEO Jensen Huang akui berselingkuh dengan terduga mata-mata China"
    - "Intelijen AS dilaporkan menyebut Alice Huang mata-mata China; Beijing sebut tuduhan itu tak berdasar"
    - "Saham Nvidia turun dua hari berturut-turut, nilai pasarnya sempat di bawah 4 triliun dolar AS"
    - "Alice Huang dilaporkan membantu setidaknya 7,5 miliar dolar AS chip Nvidia masuk ke China"
    - "Trump sebut FBI turun tangan menyelidiki, anggota Kongres AS minta Huang beri keterangan tertutup"