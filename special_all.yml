australia:
  title_en: "Australia News\nSpecial Edition\nGoodbye to Cash?\nNovember 11, 2026"
  title_es: "Noticias de Australia\nEdición Especial\n¿Adiós al efectivo?\n11 de noviembre de 2026"
  title_pt: "Notícias da Austrália\nEdição Especial\nAdeus ao dinheiro?\n11 de novembro de 2026"
  title_id: "Berita Australia\nEdisi Khusus\nAkhir Uang Tunai?\n11 November 2026"
  news_en:
    - "The ACCC orders Armaguard to keep supplying cash services nationwide until June 2027"
    - "The ACCC also caps what Armaguard, the country's biggest cash carrier, can charge"
    - "Since January, large grocery and fuel retailers have had to accept cash for purchases up to $500"
    - "Cash rose to 15% of payments in 2025, the first increase since surveys began in 2007"
    - "About a third of Australians would face hardship or major inconvenience if cash became hard to access"
  news_es:
    - "La ACCC obliga a Armaguard a seguir transportando efectivo por toda Australia hasta junio de 2027"
    - "La ACCC también limita lo que puede cobrar Armaguard, la mayor transportadora de fondos del país"
    - "Desde enero, grandes supermercados y gasolineras deben aceptar efectivo en compras de hasta 500 dólares australianos"
    - "El efectivo subió al 15 % de los pagos en 2025, su primer repunte desde 2007"
    - "Un tercio de los australianos sufriría dificultades o graves molestias si costara acceder al efectivo"
  news_pt:
    - "ACCC obriga Armaguard a manter transporte de valores em toda a Austrália até junho de 2027"
    - "ACCC também limita o que a Armaguard, maior transportadora de valores do país, pode cobrar"
    - "Desde janeiro, grandes mercados e postos de combustível devem aceitar dinheiro vivo em compras de até A$ 500"
    - "Uso de dinheiro vivo subiu para 15% dos pagamentos em 2025, primeira alta desde 2007"
    - "Um terço dos australianos teria dificuldades ou grandes transtornos se o acesso ao dinheiro vivo ficasse difícil"
  news_id:
    - "ACCC mewajibkan Armaguard tetap mendistribusikan uang tunai di seluruh Australia hingga Juni 2027"
    - "ACCC juga membatasi tarif Armaguard, perusahaan pengangkut uang tunai terbesar di Australia"
    - "Sejak Januari, supermarket dan SPBU besar wajib menerima uang tunai untuk belanja hingga 500 dolar Australia"
    - "Penggunaan uang tunai naik menjadi 15 persen pembayaran pada 2025, kenaikan pertama sejak survei dimulai 2007"
    - "Sekitar sepertiga warga Australia akan kesulitan atau sangat terganggu jika uang tunai sulit diakses"
world:
  title_en: "World News\nSpecial Edition\nGoodbye to Cash?\nNovember 11, 2026"
  title_es: "Noticias del Mundo\nEdición Especial\n¿Adiós al efectivo?\n11 de noviembre de 2026"
  title_pt: "Notícias do Mundo\nEdição Especial\nAdeus ao dinheiro?\n11 de novembro de 2026"
  title_id: "Berita Dunia\nEdisi Khusus\nAkhir Uang Tunai?\n11 November 2026"
  news_en:
    - "Cash made up just 14% of US consumer payments in 2025, about six a month"
    - "Pakistan's prime minister calls for a time-bound roadmap to make all payments digital"
    - "In Nigeria, digital payments are growing, but fears over fraud and failed transactions persist"
    - "The digital euro is planned for 2029, and the ECB insists cash will stay"
    - "Analysts expect much of the future shift from cash to favour bank-to-bank payments, not cards"
  news_es:
    - "El efectivo solo supuso el 14 % de los pagos en EE. UU. en 2025, unos seis al mes"
    - "El primer ministro de Pakistán pide una hoja de ruta con plazos para digitalizar todos los pagos"
    - "En Nigeria, crecen los pagos digitales, pero persiste el miedo al fraude y a las operaciones fallidas"
    - "El euro digital está previsto para 2029 y el BCE insiste en que el efectivo seguirá"
    - "Analistas prevén que gran parte del abandono del efectivo beneficie a las transferencias, no a las tarjetas"
  news_pt:
    - "Dinheiro vivo respondeu por apenas 14% dos pagamentos nos EUA em 2025, cerca de seis por mês"
    - "Primeiro-ministro do Paquistão pede um cronograma para tornar digitais todos os pagamentos"
    - "Na Nigéria, pagamentos digitais crescem, mas persiste o medo de fraudes e transações malsucedidas"
    - "Euro digital está previsto para 2029, e o BCE garante que o dinheiro vivo continuará"
    - "Analistas esperam que boa parte do abandono do dinheiro vivo favoreça transferências entre contas, não cartões"
  news_id:
    - "Uang tunai hanya mencakup 14 persen pembayaran konsumen AS pada 2025, sekitar enam kali sebulan"
    - "Perdana Menteri Pakistan meminta peta jalan dengan tenggat waktu agar semua pembayaran menjadi digital"
    - "Di Nigeria, pembayaran digital terus tumbuh, tetapi kekhawatiran soal penipuan dan transaksi gagal tetap ada"
    - "Euro digital direncanakan meluncur pada 2029, dan ECB menegaskan uang tunai tetap ada"
    - "Analis memperkirakan sebagian besar peralihan dari uang tunai akan menguntungkan transfer antarrekening, bukan kartu"
europe:
  title_en: "Europe News\nSpecial Edition\nGoodbye to Cash?\nNovember 11, 2026"
  title_es: "Noticias de Europa\nEdición Especial\n¿Adiós al efectivo?\n11 de noviembre de 2026"
  title_pt: "Notícias da Europa\nEdição Especial\nAdeus ao dinheiro?\n11 de novembro de 2026"
  title_id: "Berita Eropa\nEdisi Khusus\nAkhir Uang Tunai?\n11 November 2026"
  news_en:
    - "The ECB says cash will stay, with a digital euro planned for 2029"
    - "EU lawmakers and governments aim to finalise digital euro and cash laws by the end of 2026"
    - "Proposed EU rules would oblige euro countries to keep cash accessible and prepare for digital outages"
    - "Swedish supermarkets and pharmacies must now accept cash under a law in force since July"
    - "Germany's Bundesbank is recruiting shops for the digital euro pilot until November 20"
  news_es:
    - "El BCE asegura que el efectivo seguirá y prevé lanzar el euro digital en 2029"
    - "Eurocámara y Veintisiete quieren cerrar a finales de 2026 las leyes del euro digital y el efectivo"
    - "La UE propone que la eurozona garantice el acceso al efectivo y se prepare ante caídas digitales"
    - "Supermercados y farmacias de Suecia ya deben aceptar efectivo por una ley vigente desde julio"
    - "El Bundesbank alemán busca comercios para el piloto del euro digital hasta el 20 de noviembre"
  news_pt:
    - "BCE afirma que o dinheiro vivo continuará, com o euro digital previsto para 2029"
    - "UE quer concluir até o fim de 2026 as leis sobre euro digital e dinheiro vivo"
    - "Regras propostas pela UE obrigariam a zona do euro a garantir dinheiro vivo e prever panes digitais"
    - "Supermercados e farmácias da Suécia devem aceitar dinheiro vivo por lei em vigor desde julho"
    - "Bundesbank, o banco central alemão, busca lojas para o piloto do euro digital até 20 de novembro"
  news_id:
    - "ECB menegaskan uang tunai tetap ada, sementara euro digital direncanakan terbit pada 2029"
    - "Parlemen dan pemerintah negara UE menargetkan aturan euro digital dan uang tunai rampung akhir 2026"
    - "Usulan aturan UE akan mewajibkan negara zona euro menjaga akses uang tunai dan mengantisipasi gangguan digital"
    - "Supermarket dan apotek di Swedia kini wajib menerima uang tunai berdasarkan aturan yang berlaku sejak Juli"
    - "Bundesbank Jerman mencari toko untuk uji coba euro digital hingga 20 November"