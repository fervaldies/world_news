world:
  title_en: "World News\nSpecial Edition\nBrooklyn Collapse\nNovember 12, 2026"
  title_es: "Noticias del Mundo\nEdición Especial\nDerrumbe en Brooklyn\n12 de noviembre de 2026"
  title_pt: "Notícias do Mundo\nEdição Especial\nDesabamento no Brooklyn\n12 de novembro de 2026"
  title_id: "Berita Dunia\nEdisi Khusus\nGedung Brooklyn Ambruk\n12 November 2026"
  news_en:
    - "A three-storey building collapses in Brooklyn, killing at least two people and injuring 17"
    - "Seven children are among the injured, and four people are in critical condition"
    - "More than 250 firefighters and paramedics search the rubble for people who may still be trapped"
    - "The building fell into an excavation site next door that had previously drawn city violations"
    - "Mayor Zohran Mamdani says buildings officials and police will investigate the cause of the collapse"
  news_es:
    - "Al menos dos muertos y 17 heridos al derrumbarse un edificio de tres plantas en Brooklyn"
    - "Siete niños figuran entre los heridos y cuatro personas están en estado crítico"
    - "Más de 250 bomberos y sanitarios buscan entre los escombros a posibles personas atrapadas"
    - "El edificio cayó sobre una excavación contigua que ya acumulaba infracciones urbanísticas"
    - "El alcalde Zohran Mamdani anuncia una investigación policial y técnica sobre las causas del derrumbe"
  news_pt:
    - "Prédio de três andares desaba no Brooklyn e deixa ao menos dois mortos e 17 feridos"
    - "Sete crianças estão entre os feridos, e quatro pessoas estão em estado grave"
    - "Mais de 250 bombeiros e socorristas buscam nos escombros pessoas que podem estar presas"
    - "O prédio caiu sobre uma escavação vizinha que já havia recebido autuações da prefeitura"
    - "Prefeito Zohran Mamdani diz que órgãos de fiscalização e a polícia vão investigar a causa do desabamento"
  news_id:
    - "Gedung tiga lantai ambruk di Brooklyn, sedikitnya dua orang tewas dan 17 luka-luka"
    - "Tujuh anak termasuk di antara korban luka, empat orang dalam kondisi kritis"
    - "Lebih dari 250 petugas pemadam kebakaran dan paramedis mencari korban yang mungkin masih terjebak di reruntuhan"
    - "Gedung itu runtuh ke lokasi galian di sebelahnya yang sebelumnya pernah melanggar aturan bangunan"
    - "Wali Kota Zohran Mamdani mengatakan dinas bangunan dan polisi akan menyelidiki penyebab ambruknya gedung"