world:
  title_en: "World News\nSpecial Edition\nUkraine's Starlink Plea\nNovember 16, 2026"
  title_es: "Noticias del Mundo\nEdición Especial\nUcrania y Starlink\n16 de noviembre de 2026"
  title_pt: "Notícias do Mundo\nEdição Especial\nUcrânia e Starlink\n16 de novembro de 2026"
  title_id: "Berita Dunia\nEdisi Khusus\nUkraina dan Starlink\n16 November 2026"
  news_en:
    - "Zelensky urges US and Musk to lift Starlink limits hampering Ukraine's air defences"
    - "Ukraine says interceptor drones lose connection above 161 km/h and cannot catch Russian jet-powered Shaheds"
    - "Zelensky warns protecting lives and the energy grid this winter depends on lifting the restrictions"
    - "SpaceX denies imposing restrictions and cites technical issues, while Musk says Washington controls Starshield"
    - "US senators Shaheen and Coons ask Musk to preserve all records on Ukraine's Starlink restrictions"
  news_es:
    - "Zelenski pide a EE. UU. y Musk levantar los límites de Starlink que frenan su defensa aérea"
    - "Según Ucrania, sus interceptores pierden conexión a más de 161 km/h y no alcanzan los Shahed rusos"
    - "Zelenski advierte de que proteger vidas y la red eléctrica este invierno depende de levantar las restricciones"
    - "SpaceX niega haber impuesto restricciones y alude a fallos técnicos; Musk dice que Washington controla Starshield"
    - "Los senadores Shaheen y Coons piden a Musk conservar todos los registros de las restricciones en Ucrania"
  news_pt:
    - "Zelensky pede aos EUA e a Musk que suspendam limites do Starlink que prejudicam a defesa aérea"
    - "Segundo a Ucrânia, drones interceptores perdem conexão acima de 161 km/h e não alcançam Shaheds russos"
    - "Zelensky alerta que proteger vidas e a rede elétrica neste inverno depende do fim das restrições"
    - "SpaceX nega ter imposto restrições e cita falhas técnicas; Musk diz que Washington controla o Starshield"
    - "Senadores americanos Shaheen e Coons pedem que Musk preserve todos os registros sobre as restrições na Ucrânia"
  news_id:
    - "Zelensky desak AS dan Musk cabut pembatasan Starlink yang menghambat pertahanan udara Ukraina"
    - "Ukraina sebut drone pencegat putus koneksi di atas 161 km/jam dan gagal mengejar Shahed jet Rusia"
    - "Zelensky peringatkan perlindungan warga dan jaringan listrik musim dingin ini bergantung pada pencabutan pembatasan"
    - "SpaceX bantah memberlakukan pembatasan dan sebut masalah teknis, Musk klaim Washington kendalikan Starshield"
    - "Senator AS Shaheen dan Coons minta Musk simpan semua catatan soal pembatasan Starlink di Ukraina"
europe:
  title_en: "Europe News\nSpecial Edition\nUkraine's Starlink Plea\nNovember 16, 2026"
  title_es: "Noticias de Europa\nEdición Especial\nUcrania y Starlink\n16 de noviembre de 2026"
  title_pt: "Notícias da Europa\nEdição Especial\nUcrânia e Starlink\n16 de novembro de 2026"
  title_id: "Berita Eropa\nEdisi Khusus\nUkraina dan Starlink\n16 November 2026"
  news_en:
    - "European Commission says reported Starshield limits on Ukraine are deeply concerning and, if confirmed, unacceptable"
    - "Danish PM Frederiksen says Europe cannot protect citizens without these satellites, vows to raise it with Washington"
    - "Zelensky says the European Commission will send generators and emergency energy funds as Russia hits the grid"
    - "EU is in talks to fully connect Ukraine to its Govsatcom secure satellite network"
    - "Germany is building its own military Starlink alternative, a move Zelensky called the right thing to do"
  news_es:
    - "La Comisión Europea ve muy preocupantes los límites de Starshield en Ucrania e inaceptables si se confirman"
    - "La danesa Frederiksen dice que Europa no puede defenderse sin estos satélites y lo planteará a Washington"
    - "Según Zelenski, la Comisión Europea enviará generadores y fondos de emergencia ante los ataques rusos"
    - "La UE negocia integrar plenamente a Ucrania en Govsatcom, su red segura de comunicaciones por satélite"
    - "Alemania desarrolla su propia alternativa militar a Starlink, una decisión que Zelenski considera acertada"
  news_pt:
    - "Comissão Europeia diz que limites ao Starshield na Ucrânia são muito preocupantes e, se confirmados, inaceitáveis"
    - "Premiê dinamarquesa Frederiksen diz que Europa não protege seus cidadãos sem esses satélites e cobrará os EUA"
    - "Zelensky diz que a Comissão Europeia enviará geradores e verba emergencial em meio a ataques russos"
    - "UE negocia integrar totalmente a Ucrânia ao Govsatcom, sua rede segura de comunicação por satélite"
    - "Alemanha desenvolve sua própria alternativa militar ao Starlink, decisão que Zelensky chamou de acertada"
  news_id:
    - "Komisi Eropa sebut laporan pembatasan Starshield di Ukraina sangat mengkhawatirkan dan tak dapat diterima jika terbukti"
    - "PM Denmark Frederiksen sebut Eropa tak bisa lindungi warganya tanpa satelit ini dan akan membahasnya dengan Washington"
    - "Zelensky sebut Komisi Eropa akan kirim generator dan dana darurat energi di tengah serangan Rusia"
    - "UE tengah berunding untuk menghubungkan Ukraina sepenuhnya ke Govsatcom, jaringan satelit aman milik Eropa"
    - "Jerman bangun alternatif Starlink militer sendiri, langkah yang menurut Zelensky sudah tepat"
