    - "Nueva Gales del Sur aconseja prever hasta 14 días; Australia Occidental, siete"
    - "La agencia federal de emergencias trabaja con Queensland en un enfoque nacional de preparación"
    - "Queensland y Woolworths animan a preparar kits de emergencia para la temporada de ciclones"
    - "El 83 % de los australianos prevé verse afectado por una emergencia en cinco años"
  news_pt:
    - "Enquanto Alemanha recomenda estoque para 10 dias, Austrália não tem padrão nacional único"
    - "Nova Gales do Sul orienta planejar até 14 dias; Austrália Ocidental, sete"
    - "Agência federal de emergências trabalha com Queensland em abordagem nacional de preparação"
    - "Queensland e Woolworths incentivam clientes a montar kits de emergência para temporada de ciclones"
    - "83% dos australianos esperam ser afetados por uma emergência nos próximos cinco anos"
  news_id:
    - "Saat Jerman anjurkan persediaan 10 hari, Australia belum punya standar nasional tunggal"
    - "New South Wales anjurkan persiapan hingga 14 hari, Australia Barat tujuh hari"
    - "Badan darurat federal bekerja sama dengan Queensland menyusun pendekatan nasional kesiapsiagaan"
    - "Queensland dan Woolworths ajak pembeli siapkan perlengkapan darurat menghadapi musim siklon"
    - "83 persen warga Australia perkirakan akan terdampak keadaan darurat dalam lima tahun"
world:
  title_en: "World News\nSpecial Edition\nEmergency Stockpiles\nNovember 27, 2026"
