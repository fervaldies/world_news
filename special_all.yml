    - "Penjualan air kemasan Inggris melonjak 67 persen dalam 10 hari sejak kampanye kesiapsiagaan"
    - "Kekhawatiran konflik, serangan siber, dan cuaca ekstrem mendorong imbauan pemerintah untuk bersiap"
    - "Jepang anjurkan persediaan rumah minimal tiga hari, idealnya satu minggu"
