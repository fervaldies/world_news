    - "Alemanha pede que famílias consigam se abastecer sozinhas por 10 dias, se possível"
    - "Ao menos 33 países estariam orientando famílias a estocar comida, água e itens essenciais"
    - "Venda de água engarrafada saltou 67% no Reino Unido em 10 dias de campanha"
    - "Temor de conflitos, ciberataques e clima extremo motiva alertas de governos"
    - "Japão recomenda estoque para pelo menos três dias e, idealmente, uma semana"
  news_id:
    - "Jerman minta rumah tangga mampu memenuhi kebutuhan sendiri selama 10 hari, jika memungkinkan"
